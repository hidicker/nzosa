# Put the Supabase Edge Functions behind the online books live.
#
# Started by hand only (Actions tab, "Deploy Supabase functions", "Run
# workflow"), like the website. The access token is the repository secret
# SUPABASE_ACCESS_TOKEN; the project ref is public -- it is in every request
# the app makes.
name: Deploy Supabase functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: Which function to deploy
        type: choice
        options: [akahu, wise, gemini, gemini-demo, all]
        default: akahu

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: ronancqtbbqmsiatxmfn

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CHOSEN: ${{ inputs.function }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "The SUPABASE_ACCESS_TOKEN secret is not set." >&2
            exit 1
          fi
          if [ "$CHOSEN" = "all" ]; then names="akahu wise gemini gemini-demo"; else names="$CHOSEN"; fi
          for name in $names; do
            echo "Deploying $name"
            npx --yes supabase functions deploy "$name" --use-api --project-ref "$PROJECT_REF"
          done
